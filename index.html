<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم النصوص الفوري الذكي</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --border-color: #cbd5e1;
            --danger-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #64748b;
            font-size: 0.95rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--primary-color);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
            min-height: 130px;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .output-box {
            width: 100%;
            padding: 12px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            min-height: 130px;
            background-color: #f8fafc;
            direction: ltr;
            text-align: left;
            color: #1e293b;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .status-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        .btn-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-clear {
            background-color: var(--danger-color);
        }
        .btn-clear:hover {
            background-color: #b91c1c;
        }

        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>مترجم النصوص الفوري</h1>
        <p>اكتب النص بالعربية لتتم ترجمته إلى اللغة الإنجليزية فوراً</p>
    </header>

    <div class="container">
        <!-- نافذة إدخال النص -->
        <div class="form-group">
            <label for="inputText">النص المراد ترجمته (عربي):</label>
            <textarea id="inputText" placeholder="اكتب النص هنا..." oninput="debounceTranslate()"></textarea>
        </div>

        <!-- نافذة إظهار الترجمة الإنجليزية -->
        <div class="form-group">
            <label for="outputText" style="direction: rtl;">الترجمة الإنجليزية:</label>
            <div id="outputText" class="output-box"></div>
            <div id="status" class="status-text"></div>
        </div>

        <!-- أزرار التحكم -->
        <div class="btn-container">
            <button class="btn btn-secondary" onclick="copyTranslatedText()">📋 نسخ الترجمة</button>
            <button class="btn btn-clear" onclick="clearFields()">🗑️ مسح للبدء من جديد</button>
        </div>
    </div>

    <script>
        let timeoutId = null;

        // دالة تأخير بسيطة لتجنب إرسال طلبات كثيرة أثناء الكتابة السريعة
        function debounceTranslate() {
            clearTimeout(timeoutId);
            const input = document.getElementById('inputText').value.trim();
            const outputBox = document.getElementById('outputText');
            const statusBox = document.getElementById('status');

            if (!input) {
                outputBox.innerText = "";
                statusBox.innerText = "";
                return;
            }

            statusBox.innerText = "جاري الترجمة...";
            
            timeoutId = setTimeout(() => {
                fetchTranslation(input);
            }, 500); // ينتظر نصف ثانية بعد توقف الكتابة ليقوم بالترجمة
        }

        // جلب الترجمة الفورية من خدمة الـ API المجانية
        async function fetchTranslation(text) {
            const outputBox = document.getElementById('outputText');
            const statusBox = document.getElementById('status');

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.responseData && data.responseData.translatedText) {
                    outputBox.innerText = data.responseData.translatedText;
                    statusBox.innerText = "تمت الترجمة بنجاح ✅";
                } else {
                    outputBox.innerText = "تعذر ترجمة النص.";
                    statusBox.innerText = "";
                }
            } catch (error) {
                outputBox.innerText = "حدث خطأ في الاتصال بالشبكة.";
                statusBox.innerText = "";
            }
        }

        function copyTranslatedText() {
            const textToCopy = document.getElementById('outputText').innerText;
            if (!textToCopy) {
                alert('لا يوجد نص لنسخه!');
                return;
            }
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('تم نسخ الترجمة بنجاح!');
            }).catch(err => {
                alert('فشل النسخ.');
            });
        }

        function clearFields() {
            document.getElementById('inputText').value = "";
            document.getElementById('outputText').innerText = "";
            document.getElementById('status').innerText = "";
            document.getElementById('inputText').focus();
        }
    </script>
</body>
</html>
